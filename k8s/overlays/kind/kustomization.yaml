apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: numberone-local
resources:
  - ../../base
configMapGenerator:
  - name: numberone-billing-config
    behavior: merge
    literals:
      - OUTBOX_ENABLED=true
  - name: numberone-billing-runtime-config
    envs: [runtime.env]
images:
  - name: image.invalid/numberone-billing-service
    newName: numberone-billing-service
    newTag: r2-20261114-v2
patches:
  - path: deployment-patch.yaml
  - target: {kind: Service, name: numberone-billing-service}
    patch: |-
      - op: replace
        path: /spec/ports/0/port
        value: 8081
