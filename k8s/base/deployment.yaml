apiVersion: apps/v1
kind: Deployment
metadata:
  name: numberone-billing
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: numberone-billing-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: numberone-billing-service
    spec:
      serviceAccountName: numberone-billing
      automountServiceAccountToken: false
      # 60s dos workers + 30s HTTP + margem para encerramento do processo.
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: billing
          # Substituído por digest no workflow; não representa um repositório AWS provisionado.
          image: image.invalid/numberone-billing-service:unconfigured
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: numberone-billing-config
          env:
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: numberone-billing-runtime-config
                  key: DB_URL
            - name: OS_SERVICE_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: numberone-billing-runtime-config
                  key: OS_SERVICE_BASE_URL
            - name: INVENTORY_SERVICE_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: numberone-billing-runtime-config
                  key: INVENTORY_SERVICE_BASE_URL
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: numberone-billing-secret
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: numberone-billing-secret
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
