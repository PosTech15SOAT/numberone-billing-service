apiVersion: v1
kind: ConfigMap
metadata:
  name: numberone-billing-config
data:
  SERVER_PORT: "8080"
  SERVER_SHUTDOWN: graceful
  SPRING_LIFECYCLE_TIMEOUTPERSHUTDOWNPHASE: 30s
  LOG_LEVEL: INFO
  OUTBOX_ENABLED: "false"
  BUDGET_NOTIFICATIONS_ENABLED: "false"
  MERCADO_PAGO_ENABLED: "false"
  MERCADO_PAGO_WEBHOOK_ENABLED: "false"
  PAYMENT_OS_LOCAL_UNAUTHENTICATED_ENABLED: "false"
