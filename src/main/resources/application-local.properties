spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5433}/${DB_NAME:numberone_billing}}

billing.outbox.enabled=${OUTBOX_ENABLED:true}
