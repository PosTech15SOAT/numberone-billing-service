spring.application.name=numberone-billing-service
logging.level.root=${LOG_LEVEL:INFO}
logging.structured.format.console=ecs

# Health na mesma porta HTTP da aplicação; sem descoberta ou endpoints administrativos.
management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoints.web.exposure.include=health
management.endpoints.web.discovery.enabled=false
management.endpoints.jmx.exposure.exclude=*
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState
# SMTP é opcional; health não deve abrir conexão externa com o worker desabilitado.
management.health.mail.enabled=false

# URLs públicas contêm um bearer token; logs de acesso da plataforma também devem omitir query/body.
server.tomcat.accesslog.enabled=false
spring.mvc.log-request-details=false

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

billing.integrations.os-base-url=${OS_SERVICE_BASE_URL}
billing.integrations.inventory-base-url=${INVENTORY_SERVICE_BASE_URL}
billing.integrations.connect-timeout=2s
billing.integrations.read-timeout=5s

# TEST explícito, exclusivamente local: vendedor validado antes de nova reserva/POST e de cada GET de order.
billing.payment.mercado-pago.enabled=${MERCADO_PAGO_ENABLED:false}
billing.payment.mercado-pago.environment=${MERCADO_PAGO_ENVIRONMENT:}
billing.payment.mercado-pago.access-token=${MERCADO_PAGO_TEST_ACCESS_TOKEN:}
billing.payment.mercado-pago.expected-test-seller-id=${MERCADO_PAGO_EXPECTED_TEST_SELLER_ID:}
billing.payment.mercado-pago.connect-timeout=2s
billing.payment.mercado-pago.read-timeout=5s

# Recepção HMAC exclusivamente local TEST; consulta usa as mesmas guardas de credencial acima.
billing.payment.mercado-pago-webhook.enabled=${MERCADO_PAGO_WEBHOOK_ENABLED:false}
billing.payment.mercado-pago-webhook.environment=${MERCADO_PAGO_WEBHOOK_ENVIRONMENT:}
billing.payment.mercado-pago-webhook.secret=${MERCADO_PAGO_WEBHOOK_SECRET:}

# CT-02A PROPOSTA: acesso sem autenticação somente local, explicitamente habilitado e loopback.
billing.payment.service-order.local-unauthenticated-enabled=${PAYMENT_OS_LOCAL_UNAUTHENTICATED_ENABLED:false}
billing.payment.service-order.base-url=${PAYMENT_OS_LOCAL_BASE_URL:}
billing.payment.service-order.connect-timeout=2s
billing.payment.service-order.read-timeout=5s

# Publicação durável; habilitar somente quando região e fila estiverem configuradas.
billing.outbox.enabled=${OUTBOX_ENABLED:false}
billing.outbox.poll-interval=1s
billing.outbox.batch-size=10
billing.outbox.lease-duration=60s
billing.outbox.max-attempts=5
billing.outbox.initial-backoff=5s
billing.outbox.max-backoff=5m
billing.outbox.sqs.region=${AWS_REGION:us-east-1}
billing.outbox.sqs.queue-url=${SQS_QUEUE_URL:}
billing.outbox.sqs.endpoint=${SQS_ENDPOINT:}
billing.outbox.sqs.connection-timeout=1s
billing.outbox.sqs.read-timeout=3s
billing.outbox.sqs.api-call-timeout=5s

spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=60s

# Só habilitar após a plataforma garantir a entrada confiável e sobrescrever os headers.
billing.identity.subject-header=${GATEWAY_EMPLOYEE_SUBJECT_HEADER:X-Authenticated-Subject}

# O agendamento comercial exige chave e URL mesmo com o processador SMTP desabilitado.
billing.notifications.enabled=${BUDGET_NOTIFICATIONS_ENABLED:false}
billing.notifications.encryption-key=${BUDGET_NOTIFICATION_ENCRYPTION_KEY:}
billing.notifications.approval-base-url=${BUDGET_APPROVAL_BASE_URL:}
billing.notifications.authorization-ttl=48h
billing.notifications.resend-interval=30s
billing.notifications.poll-interval=5s
billing.notifications.batch-size=1
billing.notifications.lease-duration=120s
billing.notifications.max-attempts=5
billing.notifications.initial-backoff=30s
billing.notifications.max-backoff=30m
billing.notifications.from=${SMTP_FROM:}

spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.debug=false
