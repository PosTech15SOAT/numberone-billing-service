apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: numberone-local
resources:
  - k8s
  - ../../../numberone-service-order/k8s/overlays/kind
  - ../../k8s/overlays/kind
  - ../../../numberone-inventory-service/k8s/overlays/kind
secretGenerator:
  - name: numberone-billing-commercial
    envs: [.env]
images:
  - name: numberone-service-order
    newTag: kind
  - name: numberone-billing-service
    newTag: kind
patches:
  - path: billing-baseline.yaml
