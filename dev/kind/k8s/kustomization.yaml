apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: numberone-local
resources:
  - namespace.yaml
  - postgres/service.yaml
  - postgres/pvc.yaml
  - postgres/statefulset.yaml
  - localstack
  - localstack-dynamodb
secretGenerator:
  - name: postgres-credentials
    envs:
      - postgres/.env
configMapGenerator:
  - name: postgres-init
    files:
      - 10-provision.sh=postgres/init.sh
